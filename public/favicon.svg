<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <!--
    MinimalDS mark — the same geometry as the NavBar logo, centred in a
    square with padding. The fill follows the browser's colour scheme so
    the mark stays visible on both light and dark tab bars, using the
